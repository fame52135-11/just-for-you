<!DOCTYPE html><html lang='th'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Love Survey</title><style>body{font-family:Arial;background:#ffeef5;max-width:700px;margin:auto;padding:20px}.card{background:#fff;padding:20px;border-radius:12px}label{display:block;margin-top:12px;font-weight:bold}input,textarea{width:100%;padding:10px}button{margin-top:20px;width:100%;padding:12px;background:#d63384;color:#fff;border:none;border-radius:8px}</style></head><body><div class='card'><h2>💖 แบบสอบถามความรู้สึก 💖</h2><form id='survey'>
<label>1. รู้สึกยังไงเวลาได้คุยกับเรา?</label><input name='q1' required>
<label>2. คิดว่าเราเป็นคนแบบไหน?</label><input name='q2' required>
<label>3. ถ้าเราทักไปก่อน รู้สึกยังไง?</label><input name='q3' required>
<label>4. เคยนึกถึงเราบ้างไหม?</label><input name='q4' required>
<label>5. อยากรู้จักเรามากขึ้นไหม?</label><input name='q5' required>
<label>6. ถ้ามีโอกาส อยากไปเที่ยวด้วยกันไหม?</label><input name='q6' required>
<label>7. คิดว่ามีโอกาสพัฒนาความสัมพันธ์ไหม?</label><input name='q7' required>
<label>8. ถ้าเราบอกว่าชอบคุณ จะตอบว่า?</label><input name='q8' required>
<label>9. มีอะไรอยากบอกเราไหม?</label><textarea name='q9' required></textarea>
<label>10. ถ้าเราขอจีบ จะให้โอกาสไหม?</label><input name='q10' required>
<button>ส่งคำตอบ</button></form><p id='msg'></p></div>
<script>
const url='https://script.google.com/macros/s/AKfycbzryvp0Bd6JVbZ6O9ys0ASQeWttiC1LnHJrZnCcejPG9l2zR3lPQlkh-5WDNl8O1zEI/exec';
document.getElementById('survey').onsubmit=async(e)=>{e.preventDefault();let o={};new FormData(e.target).forEach((v,k)=>o[k]=v);try{let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});document.getElementById('msg').textContent=r.ok?'✅ ส่งสำเร็จ':'❌ ส่งไม่สำเร็จ';if(r.ok)e.target.reset();}catch(e){document.getElementById('msg').textContent='❌ ส่งไม่สำเร็จ';}};
</script></body></html>
